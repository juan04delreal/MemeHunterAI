nt=Q.rpc_connected?"RUNNING":"DEGRADED";ql.className="v "+(Q.rpc_connected?"ok":"bad");m.textContent=Q.validated_migrations||0;e.textContent=Q.entry_quotes_observed||0;x.textContent=Q.exit_quotes_observed||0;ws.textContent=W.status;ws.className="v "+(W.rpc_status==="connected"?"ok":"bad");p.textContent=W.pending_transactions||0;qa.textContent=Q.quote_provider_api_key_configured?"Quote API access configured.":"Quote API access not configured: size-specific quote tests are blocked."}catch(err){updated.textContent="Dashboard load error: "+err}}go();setInterval(go,30000)</script>
