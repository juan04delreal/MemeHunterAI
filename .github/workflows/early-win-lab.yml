name: Early-Win Lab Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "early-win-lab/state.sqlite3"
      - "early-win-lab/state.sqlite3-wal"
      - "early-win-lab/state.sqlite3-shm"

permissions:
  contents: write

concurrency:
  group: early-win-lab-paper-trading
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: early-win-lab
        run: python -m unittest -v
      - name: Run one paper-trading scan
        working-directory: early-win-lab
        run: python bot.py
      - name: Persist isolated paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add early-win-lab/state.sqlite3
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Update Early-Win Lab paper ledger [skip ci]"
            git push
          fi
