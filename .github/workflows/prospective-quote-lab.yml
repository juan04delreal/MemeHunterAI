name: Prospective quote lab (read only)
on:
  push:
    branches: ['research/prospective-quote-lab']
    paths:
      - 'prospective_lab/lab.py'
      - 'prospective_lab/collector.py'
      - 'prospective_lab/validation.py'
      - 'prospective_lab/paper_account.py'
      - 'prospective_lab/test_*.py'
      - 'prospective_lab/config.json'
      - 'prospective_lab/control.json'
      - 'prospective_lab/run.sh'
      - 'prospective_lab/pulse.json'
      - '.github/workflows/prospective-quote-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prospective-quote-lab
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'juan04delreal/MemeHunterAI' && github.ref == 'refs/heads/research/prospective-quote-lab' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/prospective-quote-lab
          fetch-depth: 1
      - name: Test safety and migration decoder
        run: python3 -m unittest discover -s prospective_lab -p 'test_*.py' -v
      - name: Collect prospective migrations and read-only quotes
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: bash prospective_lab/run.sh
